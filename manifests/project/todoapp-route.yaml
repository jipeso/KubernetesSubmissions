apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  namespace: project
  name: project-route
spec:
  parentRefs:
    - name: shared-gateway
      namespace: default
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: todoapp-svc
          port: 2323
