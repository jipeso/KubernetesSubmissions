apiVersion: batch/v1
kind: CronJob
metadata:
  namespace: project
  name: todo-backup
spec:
  schedule: "0 4 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          volumes:
            - name: backup
              emptyDir: {}
            - name: gcs-key
              secret:
                secretName: storage-sa-key
          initContainers:
            - name: dump
              image: postgres:18
              env:
                - name: PGPASSWORD
                  valueFrom:
                    configMapKeyRef:
                      name: project-config
                      key: POSTGRES_PASSWORD
              command:
                - sh
                - -c
                - pg_dump -h postgres-svc -U postgres postgres > /backup/backup.sql
              volumeMounts:
                - name: backup
                  mountPath: /backup
          containers:
            - name: upload
              image: google/cloud-sdk:slim
              command:
                - sh
                - -c
                - |
                  gcloud auth activate-service-account --key-file=/secrets/key.json
                  gcloud storage cp /backup/backup.sql gs://dwk-storage/backup-$(date +%Y-%m-%d).sql
              volumeMounts:
                - name: backup
                  mountPath: /backup
                - name: gcs-key
                  mountPath: /secrets
                  readOnly: true
