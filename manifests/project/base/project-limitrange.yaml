apiVersion: v1
kind: LimitRange
metadata:
  name: project-limits
spec:
  limits:
    - type: Container
      default:
        cpu: 250m
        memory: 256Mi
      defaultRequest:
        cpu: 50m
        memory: 256Mi
      max:
        cpu: 1000m
        memory: 512Mi
      min:
        cpu: 10m
        memory: 16Mi
