apiVersion: apps/v1
kind: Deployment
metadata:
  name: todobackend-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todobackend
  template:
    metadata:
      labels:
        app: todobackend
    spec:
      containers:
        - name: todobackend
          image: jipeso/todo-backend:v8
          env:
            - name: PORT
              value: "5000"
            - name: POSTGRES_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: project-config
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgres://postgres:$(POSTGRES_PASSWORD)@postgres-svc:5432/postgres"
            - name: NATS_URL
              valueFrom:
                configMapKeyRef:
                  name: project-config
                  key: NATS_URL
            - name: NATS_SUBJECT
              valueFrom:
                configMapKeyRef:
                  name: project-config
                  key: NATS_SUBJECT
          readinessProbe:
            initialDelaySeconds: 10
            periodSeconds: 5
            httpGet:
              path: /healthz
              port: 5000
