apiVersion: batch/v1
kind: CronJob
metadata:
  name: todo-backup
spec:
  schedule: "0 4 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: backup-claim
          containers:
            - name: dump
              image: postgres:18
              env:
                - name: PGPASSWORD
                  valueFrom:
                    configMapKeyRef:
                      name: project-config
                      key: POSTGRES_PASSWORD
              command:
                - sh
                - -c
                - |
                  FILE=/backup/backup-$(date +%Y-%m-%d-%H%M%S).sql
                  pg_dump -h postgres-svc -U postgres postgres > "$FILE"
                  echo "wrote $FILE"
                  ls -lh /backup
              volumeMounts:
                - name: backup
                  mountPath: /backup
