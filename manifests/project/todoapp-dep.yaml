apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: project
  name: todoapp-dep
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: todoapp
  template:
    metadata:
      labels:
        app: todoapp
    spec:
      volumes:
        - name: todo-data
          persistentVolumeClaim:
            claimName: shared-claim
      containers:
        - name: todoapp
          image: jipeso/todo-app:v7
          env:
            - name: PORT
              value: "3000"
          envFrom:
            - configMapRef:
                name: project-config
          volumeMounts:
            - name: todo-data
              mountPath: /usr/src/app/files
