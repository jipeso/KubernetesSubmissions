apiVersion: apps/v1
kind: Deployment
metadata:
  name: hashgenerator-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hashgenerator
  template:
    metadata:
      labels:
        app: hashgenerator
    spec:
      volumes:
        - name: shared-status
          emptyDir: {}
      containers:
        - name: hash-reader
          image: jipeso/hash-reader:v1
          env:
            - name: PORT
              value: "6000"
          volumeMounts:
            - name: shared-status
              mountPath: /usr/src/app/files
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"

        - name: hash-writer
          image: jipeso/hash-writer:v1
          volumeMounts:
            - name: shared-status
              mountPath: /usr/src/app/files
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
