apiVersion: apps/v1
kind: Deployment
metadata:
  name: todoapp-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todoapp
  template:
    metadata:
      labels:
        app: todoapp
    spec:
      volumes:
        - name: todo-data
          persistentVolumeClaim:
            claimName: shared-claim
      containers:
        - name: todoapp
          image: jipeso/todo-app:v5
          env:
            - name: PORT
              value: "3000"
          volumeMounts:
            - name: todo-data
              mountPath: /usr/src/app/files
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
