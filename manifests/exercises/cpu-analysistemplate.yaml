apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  namespace: exercises
  name: cpu-usage-rate
spec:
  metrics:
    - name: cpu-usage-rate
      interval: 1m
      count: 5
      successCondition: result[0] < 0.2
      provider:
        prometheus:
          address: http://prom-prometheus-server.monitoring.svc.cluster.local:80
          query: |
            sum(rate(container_cpu_usage_seconds_total{namespace="exercises", container!=""}[2m]))
