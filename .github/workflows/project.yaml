name: Build and publish project

on:
  push:
    branches: [main]
    paths:
      - "todo-app/**"
      - "todo-backend/**"
      - "broadcaster/**"
      - ".github/workflows/project.yaml"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and publish
        run: |-
          for app in todo-app todo-backend broadcaster; do
            docker build -t "jipeso/$app:$GITHUB_SHA" $app
            docker push "jipeso/$app:$GITHUB_SHA"
          done

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Use right images
        working-directory: manifests/project
        run: |-
          kustomize edit set image jipeso/todo-app=jipeso/todo-app:$GITHUB_SHA
          kustomize edit set image jipeso/todo-backend=jipeso/todo-backend:$GITHUB_SHA
          kustomize edit set image jipeso/broadcaster=jipeso/broadcaster:$GITHUB_SHA

      - name: commit kustomization.yaml to GitHub
        uses: EndBug/add-and-commit@v11
        with:
          add: "manifests/project/kustomization.yaml"
          message: New project version ${{ github.sha }}
          pull: "--rebase --autostash"
