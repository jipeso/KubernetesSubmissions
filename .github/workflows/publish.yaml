name: Build and publish hashgenerator

on:
  push:
    branches: [main]
    paths: ["hashgenerator/**", ".github/workflows/publish.yaml"]

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and publish
        run: |-
          docker build -t "jipeso/hash-reader:$GITHUB_SHA" hashgenerator/reader
          docker build -t "jipeso/hash-writer:$GITHUB_SHA" hashgenerator/writer
          docker push "jipeso/hash-reader:$GITHUB_SHA"
          docker push "jipeso/hash-writer:$GITHUB_SHA"

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Use right images
        working-directory: manifests/exercises
        run: |-
          kustomize edit set image jipeso/hash-reader=jipeso/hash-reader:$GITHUB_SHA
          kustomize edit set image jipeso/hash-writer=jipeso/hash-writer:$GITHUB_SHA

      - name: commit kustomization.yaml to GitHub
        uses: EndBug/add-and-commit@v11
        with:
          add: "manifests/exercises/kustomization.yaml"
          message: New version released ${{ github.sha }}
          pull: "--rebase --autostash"
