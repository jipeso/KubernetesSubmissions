name: Deploy to staging

on:
  push:
    branches: [main]
    paths:
      - "todo-app/**"
      - "todo-backend/**"
      - "broadcaster/**"
      - ".github/workflows/staging.yaml"

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and publish
        run: |-
          for app in todo-app todo-backend broadcaster; do
            docker build -t "jipeso/$app:$GITHUB_SHA" $app
            docker push "jipeso/$app:$GITHUB_SHA"
          done

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Use right images
        working-directory: manifests/project/overlays/staging
        run: |-
          for app in todo-app todo-backend broadcaster; do
            kustomize edit set image jipeso/$app=jipeso/$app:$GITHUB_SHA
          done

      - name: Commit kustomization.yaml to GitHub
        uses: EndBug/add-and-commit@v11
        with:
          add: "manifests/project/overlays/staging/kustomization.yaml"
          message: Staging release ${{ github.sha }}
          pull: "--rebase --autostash"
