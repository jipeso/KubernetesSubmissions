name: Deploy to production

on:
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and publish
        run: |-
          for app in todo-app todo-backend broadcaster; do
            docker build -t "jipeso/$app:$GITHUB_SHA" $app
            docker push "jipeso/$app:$GITHUB_SHA"
          done

      - name: Switch to main
        run: |-
          git fetch origin main
          git checkout main

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Use right images
        working-directory: manifests/project/overlays/production
        run: |-
          for app in todo-app todo-backend broadcaster; do
            kustomize edit set image jipeso/$app=jipeso/$app:$GITHUB_SHA
          done

      - name: Commit kustomization.yaml to GitHub
        uses: EndBug/add-and-commit@v11
        with:
          add: "manifests/project/overlays/production/kustomization.yaml"
          message: Production release ${{ github.ref_name }}
          pull: "--rebase --autostash"
