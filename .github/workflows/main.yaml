name: Release pipeline

on:
  push:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  GKE_CLUSTER: dwk-cluster
  GKE_ZONE: europe-north1
  REGISTRY: europe-north1-docker.pkg.dev
  REPOSITORY: dwk-repository
  IMAGE: dwk-environments
  SERVICE: dwk-environments
  BRANCH: ${{ github.ref_name }}

jobs:
  build-push-deploy:
    name: Build, Push and Deploy
    runs-on: ubuntu-latest
    environment: GKE_PROJECT

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: "${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.SERVICE_ACCOUNT }}"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Use gcloud CLI
        run: gcloud info

      - run: gcloud --quiet auth configure-docker $REGISTRY

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          project_id: ${{ env.PROJECT_ID }}
          location: ${{ env.GKE_ZONE }}

      - name: Form the image names
        run: |
          PREFIX=$REGISTRY/$PROJECT_ID/$REPOSITORY
          echo "APP_IMAGE=$PREFIX/todo-app:$BRANCH-$GITHUB_SHA" >> $GITHUB_ENV
          echo "BACKEND_IMAGE=$PREFIX/todo-backend:$BRANCH-$GITHUB_SHA" >> $GITHUB_ENV

      - name: Build
        run: |
          docker build -t $APP_IMAGE ./todo-app
          docker build -t $BACKEND_IMAGE ./todo-backend

      - name: Publish
        run: |
          docker push $APP_IMAGE
          docker push $BACKEND_IMAGE

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Deploy
        run: |-
          kustomize edit set image jipeso/todo-app=$APP_IMAGE
          kustomize edit set image jipeso/todo-backend=$BACKEND_IMAGE
          kustomize build . | kubectl apply -f -
          kubectl -n project rollout status deployment todoapp-dep
          kubectl -n project rollout status deployment todobackend-dep
          kubectl -n project get services,ingress -o wide
