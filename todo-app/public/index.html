<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Todo App</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <h1>Todo App</h1>
    <img src="/image" />

    <form id="todo-form">
      <input
        type="text"
        name="content"
        maxlength="140"
        placeholder="Enter a new todo (max 140 characters)"
        required
      />
      <button type="submit">Send</button>
    </form>

    <h2>Todos</h2>
    <ul id="todo-list"></ul>

    <script type="module" src="/app.js"></script>
  </body>
</html>
